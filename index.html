<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Wrap Designer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d; color: #f0f0f0;
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .loader {
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .logo-t {
    width: 32px; height: 32px; background: #e8142a;
    clip-path: polygon(20% 0%,80% 0%,100% 20%,60% 20%,60% 100%,40% 100%,40% 20%,0% 20%);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  p { font-size: 13px; color: #484848; }
  /* Fallback links if JS disabled */
  .fallback { display: none; flex-direction: column; gap: 12px; margin-top: 8px; }
  noscript .fallback { display: flex; }
  a.btn {
    padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
    text-decoration: none; text-align: center;
  }
  .btn-desktop { background: #e8142a; color: white; }
  .btn-mobile  { background: #1c1c1c; border: 1px solid rgba(255,255,255,0.1); color: #888; }
</style>
</head>
<body>
<div class="loader">
  <div class="logo-t"></div>
  <p>Redirecting...</p>
  <noscript>
    <div class="fallback">
      <a class="btn btn-desktop" href="tesla-wrap-editor.html">Open Desktop Version</a>
      <a class="btn btn-mobile"  href="tesla-wrap-editor-mobile.html">Open Mobile Version</a>
    </div>
  </noscript>
</div>
<script>
  if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    location.replace('tesla-wrap-editor-mobile.html');
  } else {
    location.replace('tesla-wrap-editor.html');
  }
</script>
</body>
</html>
